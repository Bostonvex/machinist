<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Machinist task analytics</title>
  <desc id="desc">Vector capture of the live task analytics dashboard with duration, success, token coverage, and completed run metrics.</desc>
  <style>
    .sans{font-family:sans-serif}.serif{font-family:serif}.mono{font-family:monospace}.fg{fill:#edf1ef}.muted{fill:#96a09d}.blue{fill:#69b5d1}.line{stroke:#303536;stroke-width:1.5}.card{fill:#191d1e;stroke:#303536;stroke-width:1.5}.label{font-size:15px;font-weight:600;letter-spacing:.06em}.body{font-size:17px}.small{font-size:14px}.metric{font-size:47px;font-weight:620;letter-spacing:-.035em}.nav{font-size:16px}.tablehead{font-size:13px;font-weight:650;letter-spacing:.08em}.table{font-size:16px}
  </style>
  <rect width="1440" height="900" fill="#151819"/>
  <rect width="236" height="900" fill="#111415"/>
  <path d="M28 58V35c0-10 6-16 15-16s15 6 15 16v11h6V35c0-10 6-16 15-16s15 6 15 16v23" fill="none" stroke="#69b5d1" stroke-width="5" stroke-linecap="round"/>
  <text x="108" y="48" class="serif fg" font-size="27" font-weight="600">machinist</text>
  <g class="sans nav muted">
    <text x="40" y="126">⌁  Runs</text><text x="205" y="126">5</text>
    <rect x="0" y="145" width="236" height="48" fill="#1b2021"/><rect x="14" y="157" width="3" height="24" fill="#69b5d1"/>
    <text x="40" y="176" class="fg">▥  Analytics</text>
    <text x="40" y="226">◎  Agents &amp; infra</text>
    <text x="40" y="276">▤  Workers</text>
    <text x="40" y="326">◷  Triggers</text><text x="205" y="326">0</text>
    <text x="40" y="376">▣  Commands</text>
    <line x1="22" y1="806" x2="214" y2="806" class="line"/>
    <text x="40" y="842">▤  1 worker online</text>
    <text x="40" y="878">◔  Dark theme</text>
  </g>

  <g transform="translate(286 42)">
    <text x="0" y="42" class="serif fg" font-size="48" font-weight="520" letter-spacing="-1.5">Task analytics</text>
    <text x="0" y="78" class="sans muted body">Task outcomes with measured run duration and executor-reported token usage.</text>
    <text x="876" y="12" class="sans muted label">TIME WINDOW</text>
    <rect x="876" y="28" width="226" height="52" rx="3" fill="#131617" stroke="#303536" stroke-width="1.5"/>
    <text x="896" y="61" class="sans fg body">Last 30 days</text><text x="1072" y="61" class="sans muted body">⌄</text>
    <line x1="0" y1="112" x2="1102" y2="112" class="line"/>

    <rect x="0" y="144" width="612" height="220" rx="4" class="card"/>
    <text x="28" y="184" class="sans muted body">Average task time</text>
    <text x="28" y="250" class="sans fg metric">4m 37s</text>
    <text x="28" y="328" class="sans muted body">5 contributing tasks with complete run timing</text>

    <rect x="634" y="144" width="222" height="104" rx="4" class="card"/>
    <text x="658" y="180" class="sans muted body">Total tasks</text><text x="658" y="226" class="sans fg" font-size="34" font-weight="600">5</text>
    <rect x="878" y="144" width="224" height="104" rx="4" class="card"/>
    <text x="902" y="180" class="sans muted body">Success rate</text><text x="902" y="226" class="sans fg" font-size="34" font-weight="600">100%</text>
    <rect x="634" y="260" width="222" height="104" rx="4" class="card"/>
    <text x="658" y="296" class="sans muted body">Failed tasks</text><text x="658" y="342" class="sans fg" font-size="34" font-weight="600">0</text>
    <rect x="878" y="260" width="224" height="104" rx="4" class="card"/>
    <text x="902" y="296" class="sans muted body">Active tasks</text><text x="902" y="342" class="sans fg" font-size="34" font-weight="600">0</text>

    <rect x="0" y="390" width="527" height="126" rx="4" class="card"/>
    <text x="24" y="430" class="sans muted label">TOTAL REPORTED TOKENS</text>
    <text x="24" y="477" class="sans fg" font-size="38" font-weight="580" letter-spacing="2">1,714,971</text>
    <text x="24" y="500" class="sans muted small">Input plus output tokens reported in this window.</text>
    <rect x="549" y="390" width="553" height="126" rx="4" class="card"/>
    <text x="573" y="430" class="sans muted label">REPORTING COVERAGE</text>
    <text x="573" y="477" class="sans fg" font-size="38" font-weight="580">5 of 5 runs</text>
    <text x="573" y="500" class="sans muted small">Every completed run reported usage.</text>

    <text x="0" y="565" class="sans fg" font-size="18" font-weight="650">Completed run metrics</text>
    <text x="0" y="590" class="sans muted small">Duration and reported token usage for runs belonging to tasks in this window.</text>
    <rect x="0" y="612" width="1102" height="232" rx="4" fill="#171b1c" stroke="#303536" stroke-width="1.5"/>
    <g class="sans muted tablehead"><text x="24" y="642">RUN</text><text x="310" y="642">COMMAND</text><text x="610" y="642">DURATION</text><text x="846" y="642">REPORTED TOKEN USAGE</text></g>
    <g class="sans table"><line x1="0" y1="658" x2="1102" y2="658" class="line"/><line x1="0" y1="696" x2="1102" y2="696" class="line"/><line x1="0" y1="734" x2="1102" y2="734" class="line"/><line x1="0" y1="772" x2="1102" y2="772" class="line"/><line x1="0" y1="810" x2="1102" y2="810" class="line"/>
      <g class="mono muted"><text x="24" y="684">c7617bac</text><text x="24" y="722">e370e62f</text><text x="24" y="760">955797c4</text><text x="24" y="798">9f04e74c</text><text x="24" y="836">e48d5a5e</text></g>
      <g class="fg"><text x="310" y="684">Foreman</text><text x="310" y="722">Foreman</text><text x="310" y="760">Foreman</text><text x="310" y="798">Shadow-Replay</text><text x="310" y="836">Local-Check</text></g>
      <g class="fg"><text x="610" y="684">1m 40s</text><text x="610" y="722">2m 38s</text><text x="610" y="760">7m 6s</text><text x="610" y="798">11m 8s</text><text x="610" y="836">31.706s</text></g>
      <g class="fg"><text x="846" y="684">60,350</text><text x="846" y="722">142,308</text><text x="846" y="760">264,462</text><text x="846" y="798">1,198,197</text><text x="846" y="836">49,654</text></g>
    </g>
  </g>
</svg>
