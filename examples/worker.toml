# Machine-local paths only. Commands and script workflows belong in config.toml.
# name is optional and defaults to the machine hostname.
data_directory = "~/.machinist/worker"

# Platform discovery is enabled by default. Tags are trusted operator policy,
# not automatically inferred facts.
[environment]
detect = true
tags = []

[control_plane]
url = "http://127.0.0.1:7331"
token_file = "~/.machinist/server/worker.token"

[executors.codex]
command = ["codex", "exec", "--json", "--model={{machinist.model}}", "--sandbox", "danger-full-access", "-"]
models = { luna = "gpt-5.6-luna", terra = "gpt-5.6-terra", sol = "gpt-5.6-sol" }

[executors.claude]
command = ["claude", "--print", "--verbose", "--output-format", "stream-json", "--model={{machinist.model}}", "--dangerously-skip-permissions"]
models = { haiku = "haiku", sonnet = "sonnet", opus = "opus" }

