# Machine-local paths only. Commands and script workflows belong in config.toml.
# name is optional and defaults to the machine hostname.
data_directory = "~/.machinist/worker"

# Platform discovery is enabled by default. Tags are trusted operator policy,
# not automatically inferred facts.
[environment]
detect = true
tags = []

# Optional metadata-only telemetry. Both MACHINIST_TELEMETRY_* and the legacy
# BUZZ_TELEMETRY_* aliases are supplied to instrumented harnesses. The token
# value and identity salt never enter Machinist configuration or the server.
# [telemetry]
# enabled = true
# url = "http://127.0.0.1:7900/api/v1/events"
# token_file = "~/.config/buzz-agent-observability/ingest-token"
# identity_salt_file = "~/.config/buzz-agent-observability/identity-salt"
# endpoint_id = "dgx-primary"

[control_plane]
url = "http://127.0.0.1:7331"
token_file = "~/.machinist/server/worker.token"

[executors.codex]
command = ["codex", "exec", "--json", "--model={{machinist.model}}", "--sandbox", "danger-full-access", "-"]
models = { luna = "gpt-5.6-luna", terra = "gpt-5.6-terra", sol = "gpt-5.6-sol" }
herdr_agent = "codex"
herdr_args = ["--model={{machinist.model}}", "--sandbox", "danger-full-access"]

[executors.claude]
command = ["claude", "--print", "--verbose", "--output-format", "stream-json", "--model={{machinist.model}}", "--dangerously-skip-permissions"]
models = { haiku = "haiku", sonnet = "sonnet", opus = "opus" }
herdr_agent = "claude"
herdr_args = ["--model={{machinist.model}}", "--dangerously-skip-permissions"]

