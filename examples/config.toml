[server]
listen = "127.0.0.1:7331"
database = "~/.machinist/server/machinist.db"
worker_token_file = "~/.machinist/server/worker.token"
# max_concurrent_jobs = 1

# Read-only bridge to the telemetry collector dashboard.
# [observability]
# enabled = true
# url = "http://127.0.0.1:7900"

# The telemetry collector Machinist serves, started with
# `machinist collector start`. [observability] above says where the control
# plane *reads* a collector from; this says where one is offered. A deployment
# can do either without the other.
#
# Both secrets are required and are created on first start. The salt is never
# read by the collector: producers hash their identities with it before they
# send anything.
# [collector]
# enabled = true
# listen = "127.0.0.1:7900"
# database = "~/.machinist/collector/telemetry.db"
# token_file = "~/.config/buzz-agent-observability/ingest-token"
# identity_salt_file = "~/.config/buzz-agent-observability/identity-salt"
# retention = "168h"
# provider_interval = "10s"

# Optional shared-infrastructure pollers. Each table may appear once, because
# two providers under one name would share a status row and an operator reading
# it could not tell which of them was failing.
# [collector.vllm]
# metrics_url = "http://127.0.0.1:18000/metrics"
# endpoint_id = "vllm-primary"

# [collector.nvidia]        # this machine's GPUs
# node_id = "local-nvidia"

# [collector.nvidia_remote] # another node's, over strict-host-verified SSH
# node_id = "dgx-spark"
# ssh_host = "spark"

# The model proxy. It runs as its own process, in front of one endpoint, and
# measures every call the harness makes through it. Point the harness's base URL
# at `listen` instead of `upstream`, and it needs no other change.
# [collector.proxy]
# listen = "127.0.0.1:7901"
# upstream = "http://127.0.0.1:18000"
# model = "ds-0731"
# endpoint_id = "vllm-primary"
# context_token_file = "~/.config/buzz-agent-observability/proxy-context-token"

# Routes choose the first compatible, available worker-local profile. A command
# uses exactly one of executor, profile, or route.
# [routes.implementation]
# profiles = ["dgx-deepcode", "codex-subscription", "deepseek"]
# max_attempts = 3
# max_total_tokens = 150000
# fallback_on = ["capacity", "rate_limit", "transient"]
#
# [commands.implement]
# route = "implementation"
# role = "implementer"
# prompt_file = "prompts/foreman.md"
# timeout = "120m"

[commands.foreman]
executor = "codex"
prompt_file = "prompts/foreman.md"
timeout = "120m"

[commands.audit]
executor = "codex"
prompt_file = "prompts/audit.md"
timeout = "60m"

# Offline cutover replay. Register only a disposable checkout and use a
# worker-local profile with no external mutation authority.
# [commands.shadow-replay]
# profile = "dgx-deepcode"
# role = "pilot"
# prompt_file = "prompts/shadow-replay.md"
# timeout = "45m"

[commands.shepherd]
executor = "codex"
prompt_file = "prompts/shepherd.md"
timeout = "120m"

# Schedule Shepherd for one configured repository with a trigger like this:
# [github.repositories]
# my-project = "owner/my-project"
#
# [triggers.cron.shepherd-my-project]
# schedule = "*/30 * * * *"
# timezone = "UTC"
# repository = "my-project"
# command = "shepherd"
# prompt = "Run the Shepherd queue for my-project with max_actions=3. Perform at most 3 mutating actions in this run."
