[server]
listen = "127.0.0.1:7331"
database = "~/.machinist/server/machinist.db"
worker_token_file = "~/.machinist/server/worker.token"
# max_concurrent_jobs = 1

# Read-only bridge to the telemetry collector dashboard.
# [observability]
# enabled = true
# url = "http://127.0.0.1:7900"

# The telemetry collector Machinist serves, started with
# `machinist collector start`. [observability] above says where the control
# plane *reads* a collector from; this says where one is offered. A deployment
# can do either without the other.
#
# Both secrets are required and are created on first start. The salt is never
# read by the collector: producers hash their identities with it before they
# send anything.
# [collector]
# enabled = true
# listen = "127.0.0.1:7900"
# database = "~/.machinist/collector/telemetry.db"
# token_file = "~/.machinist/collector/ingest-token"
# identity_salt_file = "~/.machinist/collector/identity-salt"
# retention = "168h"
# provider_interval = "10s"

# Optional shared-infrastructure pollers. Two providers under one name would
# share a status row, and an operator reading it could not tell which of them
# was failing -- so vllm, nvidia and proxy each appear once, and nvidia_remote
# repeats only because every node it names is named separately.
# [collector.vllm]
# metrics_url = "http://127.0.0.1:18000/metrics"
# endpoint_id = "vllm-primary"

# [collector.nvidia]        # this machine's GPUs
# node_id = "local-nvidia"

# Another node's GPUs, over strict-host-verified SSH. Repeat the table for each
# node. Every node needs a node_id no other node uses -- local or remote -- since
# that name keys the status row and is filed with every sample.
# [[collector.nvidia_remote]]
# node_id = "spark-0e9f"
# ssh_host = "spark-0e9f"

# [[collector.nvidia_remote]]
# node_id = "spark-27c2"
# ssh_host = "spark-27c2"

# The model proxy. It runs as its own process, in front of one endpoint, and
# measures every call the harness makes through it. Point the harness's base URL
# at `listen` instead of `upstream`, and it needs no other change.
# [collector.proxy]
# listen = "127.0.0.1:7901"
# upstream = "http://127.0.0.1:18000"
# model = "ds-0731"
# endpoint_id = "vllm-primary"
# context_token_file = "~/.machinist/collector/proxy-context-token"

# Routes choose the first compatible, available worker-local profile. A command
# uses exactly one of executor, profile, or route.
# [routes.implementation]
# profiles = ["dgx-deepcode", "codex-subscription", "deepseek"]
# max_attempts = 3
# max_total_tokens = 150000
# fallback_on = ["capacity", "rate_limit", "transient"]
#
# [commands.implement]
# route = "implementation"
# role = "implementer"
# prompt_file = "prompts/foreman.md"
# timeout = "120m"

[commands.foreman]
executor = "codex"
prompt_file = "prompts/foreman.md"
timeout = "120m"

[commands.audit]
executor = "codex"
prompt_file = "prompts/audit.md"
timeout = "60m"

# Offline cutover replay. Register only a disposable checkout and use a
# worker-local profile with no external mutation authority.
# [commands.shadow-replay]
# profile = "dgx-deepcode"
# role = "pilot"
# prompt_file = "prompts/shadow-replay.md"
# timeout = "45m"

[commands.shepherd]
executor = "codex"
prompt_file = "prompts/shepherd.md"
timeout = "120m"

# The Foreman never plans, builds, or reviews its own work. It hands each of
# those to a fresh delegate, and a harness with no native subagents satisfies
# that with `machinist run --command delegate-plan|delegate-build|delegate-review`,
# which is a separate process with its own context. These three commands are
# what those runs resolve to, so the Foreman prompt and this file have to agree:
# a prompt that names a command nothing defines blocks the run it was meant to
# unblock.
[commands.delegate-plan]
executor = "codex"
role = "planner"
prompt_file = "prompts/delegate-plan.md"
timeout = "45m"

[commands.delegate-build]
executor = "codex"
role = "implementer"
prompt_file = "prompts/delegate-build.md"
timeout = "90m"

# The role is not a label here. The review route reads it to decide whether a
# submitted verdict is independent of the run it judges, and a review recorded
# by a run with any other role is refused.
[commands.delegate-review]
executor = "codex"
role = "reviewer"
prompt_file = "prompts/reviewer.md"
timeout = "45m"

# Schedule Shepherd for one configured repository with a trigger like this:
# [github.repositories]
# my-project = "owner/my-project"
#
# [triggers.cron.shepherd-my-project]
# schedule = "*/30 * * * *"
# timezone = "UTC"
# repository = "my-project"
# command = "shepherd"
# prompt = "Run the Shepherd queue for my-project with max_actions=3. Perform at most 3 mutating actions in this run."
